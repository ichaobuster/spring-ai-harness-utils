## OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.base-url=https://ark.cn-beijing.volces.com/api/coding/v3
spring.ai.openai.chat.completions-path=/chat/completions

## Harness
spring.ai.harness.agents.storage-provider=local
spring.ai.harness.agents.workspace-dir=/tmp/harness/workspace

# Redis
# Observability
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.tools.observations.include-content=true
management.tracing.sampling.probability=1.0
management.observations.annotations.enabled=true
management.observations.enable.http.server.requests=false
management.observations.enable.http.client.requests=false
otel.instrumentation.spring-webmvc.enabled=false
otel.instrumentation.spring-web.enabled=false
